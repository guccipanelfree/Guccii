name: Settings APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Create project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/shtile
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          'rootProject.name = "Settings"' \
          'include(":app")' \
          > settings.gradle

          printf '%s\n' \
          'plugins {' \
          "    id 'com.android.application' version '8.2.2' apply false" \
          "    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false" \
          '}' \
          > build.gradle

          printf '%s\n' \
          'android.useAndroidX=true' \
          'android.nonTransitiveRClass=true' \
          'org.gradle.jvmargs=-Xmx2048m' \
          > gradle.properties

          printf '%s\n' \
          'plugins {' \
          "    id 'com.android.application'" \
          "    id 'org.jetbrains.kotlin.android'" \
          '}' \
          'android {' \
          "    namespace 'com.example.shtile'" \
          '    compileSdk 34' \
          '    defaultConfig {' \
          '        applicationId "com.example.shtile"' \
          '        minSdk 24' \
          '        targetSdk 34' \
          '        versionCode 1' \
          '        versionName "1.0"' \
          '    }' \
          '    buildTypes {' \
          '        release {' \
          '            minifyEnabled false' \
          '        }' \
          '    }' \
          '    compileOptions {' \
          '        sourceCompatibility JavaVersion.VERSION_17' \
          '        targetCompatibility JavaVersion.VERSION_17' \
          '    }' \
          "    kotlinOptions {" \
          "        jvmTarget = '17'" \
          '    }' \
          '}' \
          'dependencies {' \
          "    implementation 'androidx.appcompat:appcompat:1.6.1'" \
          '}' \
          > app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="Settings" android:theme="@style/Theme.AppCompat.DayNight">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".SafeTileService" android:exported="true" android:icon="@drawable/ic_tile_normal" android:label="Gucci Normal" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter><action android:name="android.service.quicksettings.action.QS_TILE"/></intent-filter>
                      <meta-data android:name="android.service.quicksettings.ACTIVE_TILE" android:value="false"/>
                  </service>
                  <service android:name=".BrutalTileService" android:exported="true" android:icon="@drawable/ic_tile_brutal" android:label="Gucci Brutal" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter><action android:name="android.service.quicksettings.action.QS_TILE"/></intent-filter>
                      <meta-data android:name="android.service.quicksettings.ACTIVE_TILE" android:value="false"/>
                  </service>
                  <service android:name=".HideTileService" android:exported="true" android:icon="@drawable/ic_tile_hide" android:label="Hide" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter><action android:name="android.service.quicksettings.action.QS_TILE"/></intent-filter>
                      <meta-data android:name="android.service.quicksettings.ACTIVE_TILE" android:value="false"/>
                  </service>
                  <service android:name=".UnhideTileService" android:exported="true" android:icon="@drawable/ic_tile_unhide" android:label="Unhide" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter><action android:name="android.service.quicksettings.action.QS_TILE"/></intent-filter>
                      <meta-data android:name="android.service.quicksettings.ACTIVE_TILE" android:value="false"/>
                  </service>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/example/shtile/SafeTileService.kt <<'KT'
          package com.example.shtile
          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.widget.Toast
          class SafeTileService : TileService() {
              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply { label = "Gucci Normal"; state = Tile.STATE_INACTIVE; updateTile() }
              }
              override fun onClick() {
                  super.onClick()
                  qsTile?.state = Tile.STATE_ACTIVE; qsTile?.updateTile()
                  Thread {
                      val code = runAsRoot()
                      Handler(Looper.getMainLooper()).post {
                          qsTile?.state = Tile.STATE_INACTIVE; qsTile?.updateTile()
                          Toast.makeText(this, if (code == 0) "Normal Done" else "Normal Exit $code", Toast.LENGTH_SHORT).show()
                      }
                  }.start()
              }
              private fun runAsRoot(): Int = try {
                  val cmd = "cd /data/local/tmp && (echo 7; sleep 4; echo 2; sleep 2) | /system/bin/toybox script -q -c './.ixl' /dev/null >/dev/null 2>&1"
                  val p = ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start()
                  p.inputStream.close(); p.waitFor()
              } catch (e: Exception) { -1 }
          }
          KT

          cat > app/src/main/java/com/example/shtile/BrutalTileService.kt <<'KT'
          package com.example.shtile
          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.widget.Toast
          class BrutalTileService : TileService() {
              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply { label = "Gucci Brutal"; state = Tile.STATE_INACTIVE; updateTile() }
              }
              override fun onClick() {
                  super.onClick()
                  qsTile?.state = Tile.STATE_ACTIVE; qsTile?.updateTile()
                  Thread {
                      val code = runAsRoot()
                      Handler(Looper.getMainLooper()).post {
                          qsTile?.state = Tile.STATE_INACTIVE; qsTile?.updateTile()
                          Toast.makeText(this, if (code == 0) "Brutal Done" else "Brutal Exit $code", Toast.LENGTH_SHORT).show()
                      }
                  }.start()
              }
              private fun runAsRoot(): Int = try {
                  val cmd = "cd /data/local/tmp && (echo 2; sleep 4; echo 7; sleep 2) | ./Gucci_brutal >/dev/null 2>&1"
                  val p = ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start()
                  p.inputStream.close(); p.waitFor()
              } catch (e: Exception) { -1 }
          }
          KT

          cat > app/src/main/java/com/example/shtile/HideTileService.kt <<'KT'
          package com.example.shtile
          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.widget.Toast
          class HideTileService : TileService() {
              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply { label = "Hide"; state = Tile.STATE_INACTIVE; updateTile() }
              }
              override fun onClick() {
                  super.onClick()
                  qsTile?.state = Tile.STATE_ACTIVE; qsTile?.updateTile()
                  Thread {
                      val code = try {
                          val p = ProcessBuilder("su", "-c", "pm disable-user --user 0 com.example.shtile/.MainActivity").redirectErrorStream(true).start()
                          p.inputStream.close(); p.waitFor()
                      } catch (e: Exception) { -1 }
                      Handler(Looper.getMainLooper()).post {
                          qsTile?.state = Tile.STATE_INACTIVE; qsTile?.updateTile()
                          Toast.makeText(this, if (code == 0) "Hide Done" else "Hide Exit $code", Toast.LENGTH_SHORT).show()
                      }
                  }.start()
              }
          }
          KT

          cat > app/src/main/java/com/example/shtile/UnhideTileService.kt <<'KT'
          package com.example.shtile
          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.widget.Toast
          class UnhideTileService : TileService() {
              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply { label = "Unhide"; state = Tile.STATE_INACTIVE; updateTile() }
              }
              override fun onClick() {
                  super.onClick()
                  qsTile?.state = Tile.STATE_ACTIVE; qsTile?.updateTile()
                  Thread {
                      val code = try {
                          val p = ProcessBuilder("su", "-c", "pm enable --user 0 com.example.shtile/.MainActivity").redirectErrorStream(true).start()
                          p.inputStream.close(); p.waitFor()
                      } catch (e: Exception) { -1 }
                      Handler(Looper.getMainLooper()).post {
                          qsTile?.state = Tile.STATE_INACTIVE; qsTile?.updateTile()
                          Toast.makeText(this, if (code == 0) "Unhide Done" else "Unhide Exit $code", Toast.LENGTH_SHORT).show()
                      }
                  }.start()
              }
          }
          KT

          cat > app/src/main/java/com/example/shtile/MainActivity.kt <<'KT'
          package com.example.shtile
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              private lateinit var status: TextView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  status = findViewById(R.id.status)
                  findViewById<Button>(R.id.testSafeBtn).setOnClickListener { runTestSafe() }
                  findViewById<Button>(R.id.testBrutalBtn).setOnClickListener { runTestBrutal() }
                  status.text = "Ready to test."
              }
              private fun runTestSafe() {
                  status.text = "Running Normal on .ixl..."
                  Thread {
                      val out = try {
                          val cmd = "cd /data/local/tmp && (echo 7; sleep 4; echo 2; sleep 2) | /system/bin/toybox script -q -c './.ixl' /dev/null"
                          val p = ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start()
                          val text = p.inputStream.bufferedReader().readText()
                          val code = p.waitFor()
                          "$text\nexit=$code"
                      } catch (e: Exception) { "Error: ${e.message}" }
                      runOnUiThread { status.text = "Normal Result:\n\n$out" }
                  }.start()
              }
              private fun runTestBrutal() {
                  status.text = "Running Brutal on Gucci_brutal..."
                  Thread {
                      val out = try {
                          val cmd = "cd /data/local/tmp && (echo 2; sleep 4; echo 7; sleep 2) | ./Gucci_brutal"
                          val p = ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start()
                          val text = p.inputStream.bufferedReader().readText()
                          val code = p.waitFor()
                          "$text\nexit=$code"
                      } catch (e: Exception) { "Error: ${e.message}" }
                      runOnUiThread { status.text = "Brutal Result:\n\n$out" }
                  }.start()
              }
          }
          KT

          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:padding="24dp" android:layout_width="match_parent" android:layout_height="match_parent">
              <Button android:id="@+id/testSafeBtn" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Test Normal (.ixl)" />
              <Button android:id="@+id/testBrutalBtn" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:text="Test Brutal (Gucci_brutal)" />
              <TextView android:id="@+id/status" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingTop="16dp" android:typeface="monospace" android:textSize="12sp" />
          </LinearLayout>
          XML

          cat > app/src/main/res/drawable/ic_tile_normal.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,2L4,5v6c0,5.55 3.84,10.74 8,12 4.16,-1.26 8,-6.45 8,-12V5l-8,-3zM10.94,15.54l-3.4,-3.4 1.41,-1.41 1.99,1.99 4.24,-4.24 1.41,1.41 -5.65,5.65z"/>
          </vector>
          XML

          cat > app/src/main/res/drawable/ic_tile_brutal.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z"/>
          </vector>
          XML

          cat > app/src/main/res/drawable/ic_tile_hide.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,7c2.76,0 5,2.24 5,5 0,0.65 -0.13,1.26 -0.36,1.83l2.92,2.92c1.51,-1.26 2.7,-2.89 3.43,-4.75 -1.73,-4.39 -6,-7.5 -11,-7.5 -1.4,0 -2.74,0.25 -3.98,0.7l2.16,2.16C10.74,7.13 11.35,7 12,7zM2,4.27l2.28,2.28 0.46,0.46C3.08,8.3 1.78,10.02 1,12c1.73,4.39 6,7.5 11,7.5 1.55,0 3.03,-0.3 4.38,-0.84l0.42,0.42L19.73,22 21,20.73 3.27,3 2,4.27zM7.53,9.8l1.55,1.55c-0.05,0.21 -0.08,0.43 -0.08,0.65 0,1.66 1.34,3 3,3 0.22,0 0.44,-0.03 0.65,-0.08l1.55,1.55c-0.67,0.33 -1.41,0.53 -2.2,0.53 -2.76,0 -5,-2.24 -5,-5 0,-0.79 0.2,-1.53 0.53,-2.2zM11.84,9.02l3.15,3.15 0.02,-0.16c0,-1.66 -1.34,-3 -3,-3l-0.17,0.01z"/>
          </vector>
          XML

          cat > app/src/main/res/drawable/ic_tile_unhide.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,4.5C7,4.5 2.73,7.61 1,12c1.73,4.39 6,7.5 11,7.5s9.27,-3.11 11,-7.5c-1.73,-4.39 -6,-7.5 -11,-7.5zM12,17c-2.76,0 -5,-2.24 -5,-5s2.24,-5 5,-5 5,2.24 5,5 -2.24,5 -5,5zM12,9c-1.66,0 -3,1.34 -3,3s1.34,3 3,3 3,-1.34 3,-3 -1.34,-3 -3,-3z"/>
          </vector>
          XML

          cat > app/src/main/res/values/themes.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.DayNight" parent="Theme.AppCompat.DayNight.NoActionBar"/>
          </resources>
          XML

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Settings-debug-apk
          path: app/build/outputs/apk/debug/*.apk
